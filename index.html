    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>HabitGo · Study Smarter</title>
      <script>
      // Pre-paint theme bootstrap — avoid FOUC for dark-theme users.
      // Reads localStorage.theme and applies body class BEFORE the page
      // renders, so the bg doesn't flash light-cream then flip to dark.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark') {
            document.documentElement.classList.add('theme-pre-dark');
            window.addEventListener('DOMContentLoaded', function () {
              document.body.classList.add('theme-dark');
            });
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
