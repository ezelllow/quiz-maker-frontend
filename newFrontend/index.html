<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>QuizQuest — Daily Science Quiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #4ade80;
    --green-dark: #22c55e;
    --green-shadow: #16a34a;
    --blue: #38bdf8;
    --blue-dark: #0ea5e9;
    --red: #fb7185;
    --red-dark: #f43f5e;
    --yellow: #fbbf24;
    --purple: #c084fc;
    --orange: #fb923c;
    --pink: #f472b6;
    --cyan: #22d3ee;
    --magenta: #e879f9;
    --lime: #a3e635;
    --bg: #0a0a1f;
    --bg-2: #14142b;
    --card: rgba(30, 30, 60, 0.65);
    --card-solid: #1a1a35;
    --border: rgba(140, 140, 220, 0.25);
    --border-bright: rgba(180, 180, 255, 0.45);
    --text: #e9e9ff;
    --muted: #9d9dbf;
  }
  * { font-family: 'Nunito', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { background: #050514; color: var(--text); overscroll-behavior: none; }
  body {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(139, 92, 246, 0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(34, 211, 238, 0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(232, 121, 249, 0.12) 0%, transparent 60%),
      linear-gradient(180deg, #0a0a1f 0%, #14142b 50%, #1a0a2e 100%);
    min-height: 100vh;
  }
  /* Starfield */
  body::before, body::after {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  body::before {
    background-image:
      radial-gradient(1.5px 1.5px at 12% 24%, #fff, transparent),
      radial-gradient(1px 1px at 33% 78%, #fff, transparent),
      radial-gradient(2px 2px at 64% 45%, #fff, transparent),
      radial-gradient(1px 1px at 81% 12%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 92% 67%, #fff, transparent),
      radial-gradient(1px 1px at 47% 91%, rgba(255,255,255,0.6), transparent),
      radial-gradient(2px 2px at 7% 56%, #fff, transparent),
      radial-gradient(1px 1px at 25% 33%, rgba(180,200,255,0.8), transparent),
      radial-gradient(1px 1px at 58% 9%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 73% 88%, rgba(255,220,180,0.9), transparent);
    background-size: 400px 400px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  body::after {
    background-image:
      radial-gradient(1px 1px at 22% 64%, rgba(180,200,255,0.6), transparent),
      radial-gradient(1px 1px at 55% 22%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 88% 38%, rgba(255,180,220,0.7), transparent),
      radial-gradient(1px 1px at 14% 88%, rgba(255,255,255,0.5), transparent);
    background-size: 300px 300px;
    animation: drift 60s linear infinite;
  }
  @keyframes twinkle { 0% { opacity: 0.4; } 100% { opacity: 1; } }
  @keyframes drift { 0% { transform: translate(0,0);} 100% { transform: translate(-300px, -300px);} }
  .btn-3d {
    border-radius: 16px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    transition: transform 0.06s, box-shadow 0.06s, filter 0.1s;
    user-select: none;
    cursor: pointer;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .btn-3d:active { transform: translateY(3px); box-shadow: 0 1px 0 0 rgba(0,0,0,0.4) !important; filter: brightness(0.95); }
  .btn-green { background: linear-gradient(180deg, #4ade80, #22c55e); color: #061b0e; box-shadow: 0 4px 0 0 #15803d, 0 0 24px rgba(74, 222, 128, 0.4); border-color: #86efac; }
  .btn-green:hover { filter: brightness(1.1); box-shadow: 0 4px 0 0 #15803d, 0 0 32px rgba(74, 222, 128, 0.6); }
  .btn-blue { background: linear-gradient(180deg, #38bdf8, #0ea5e9); color: #04222e; box-shadow: 0 4px 0 0 #0369a1, 0 0 24px rgba(56, 189, 248, 0.4); border-color: #7dd3fc; }
  .btn-red { background: linear-gradient(180deg, #fb7185, #f43f5e); color: #350814; box-shadow: 0 4px 0 0 #be123c, 0 0 24px rgba(251, 113, 133, 0.4); border-color: #fda4af; }
  .btn-white { background: rgba(255,255,255,0.08); color: var(--text); box-shadow: 0 4px 0 0 rgba(0,0,0,0.4); border: 2px solid var(--border); backdrop-filter: blur(8px); }
  .btn-white:hover { background: rgba(255,255,255,0.15); border-color: var(--border-bright); }
  .btn-yellow { background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #3a1d04; box-shadow: 0 4px 0 0 #b45309, 0 0 24px rgba(251, 191, 36, 0.4); border-color: #fcd34d; }
  .btn-purple { background: linear-gradient(180deg, #c084fc, #a855f7); color: #1f0633; box-shadow: 0 4px 0 0 #6b21a8, 0 0 24px rgba(192, 132, 252, 0.5); border-color: #d8b4fe; }
  .btn-disabled { background: rgba(80,80,110,0.4) !important; color: #6b6b8a !important; box-shadow: 0 4px 0 0 rgba(0,0,0,0.3) !important; cursor: not-allowed; border-color: rgba(140,140,180,0.2) !important; filter: none !important;}

  .answer-tile {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 2px solid var(--border);
    border-bottom-width: 4px;
    border-radius: 16px;
    padding: 18px 16px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .answer-tile:hover:not(.locked) { border-color: var(--border-bright); background: rgba(56,189,248,0.08); transform: translateY(-1px); }
  .answer-tile.selected { border-color: var(--cyan); background: rgba(34,211,238,0.15); color: #a5f3fc; box-shadow: 0 0 24px rgba(34,211,238,0.35); }
  .answer-tile.correct { border-color: var(--green); background: rgba(74,222,128,0.15); color: #bbf7d0; box-shadow: 0 0 28px rgba(74,222,128,0.5); }
  .answer-tile.wrong { border-color: var(--red); background: rgba(251,113,133,0.15); color: #fecdd3; box-shadow: 0 0 28px rgba(251,113,133,0.45); }
  .answer-tile .letter {
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(140,140,220,0.15); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px;
    border: 2px solid var(--border); flex-shrink: 0;
  }
  .answer-tile.selected .letter { background: rgba(34,211,238,0.2); border-color: var(--cyan); color: var(--cyan); }
  .answer-tile.correct .letter { background: rgba(74,222,128,0.2); border-color: var(--green); color: var(--green); }
  .answer-tile.wrong .letter { background: rgba(251,113,133,0.2); border-color: var(--red); color: var(--red); }

  .progress-bar {
    background: rgba(140,140,220,0.18);
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border);
  }
  .progress-fill {
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    box-shadow: 0 0 14px rgba(34, 211, 238, 0.6);
    height: 100%;
    transition: width 0.4s ease;
    border-radius: 999px;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 3px; left: 8px; right: 8px;
    height: 4px;
    background: rgba(255,255,255,0.4);
    border-radius: 999px;
  }
  .pop-in { animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .slide-up { animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  .shake { animation: shake 0.4s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
  .bounce { animation: bounce 0.6s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .confetti { position: fixed; pointer-events: none; top: -20px; width: 10px; height: 14px; opacity: 0.9; z-index: 100; }
  @keyframes fall { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(110vh) rotate(720deg); } }

  /* ===== Global remap so inline Tailwind utilities fit the dark space theme ===== */
  .bg-white { background: var(--card) !important; backdrop-filter: blur(10px); }
  .bg-gray-50 { background: rgba(140,140,220,0.08) !important; }
  .text-gray-400, .text-gray-500, .text-gray-600, .text-gray-700, .text-gray-800 { color: var(--muted) !important; }
  .border-gray-100, .border-gray-200, .border-gray-300 { border-color: var(--border) !important; }
  .border-blue-400 { border-color: var(--cyan) !important; box-shadow: 0 0 16px rgba(34,211,238,0.35); }
  .bg-blue-50 { background: rgba(34,211,238,0.12) !important; }
  .text-blue-500, .text-blue-700 { color: var(--cyan) !important; }
  .bg-blue-500 { background: linear-gradient(180deg, var(--cyan), var(--blue-dark)) !important; box-shadow: 0 0 18px rgba(34,211,238,0.5); }
  .bg-orange-100 { background: rgba(251,146,60,0.15) !important; border: 1px solid rgba(251,146,60,0.35); }
  .text-orange-500, .text-orange-600, .text-orange-700, .text-orange-800 { color: #fdba74 !important; }
  .bg-yellow-100, .bg-yellow-50 { background: rgba(251,191,36,0.15) !important; border-color: rgba(251,191,36,0.35) !important; }
  .text-yellow-600, .text-yellow-700, .text-yellow-800 { color: #fcd34d !important; }
  .border-yellow-200, .border-yellow-300 { border-color: rgba(251,191,36,0.4) !important; }
  .bg-purple-50, .bg-purple-100 { background: rgba(192,132,252,0.15) !important; }
  .text-purple-500, .text-purple-600, .text-purple-700, .text-purple-800 { color: #d8b4fe !important; }
  .border-orange-200, .border-orange-300 { border-color: rgba(251,146,60,0.4) !important; }
  .bg-red-400, .border-red-400 { border-color: var(--red) !important; }
  /* Card top-edge highlight + subtle glow */
  .bg-white { border-color: var(--border) !important; box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.08), 0 0 0 1px rgba(255,255,255,0.02); }

  .tab-btn { color: var(--muted); font-weight: 800; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .tab-btn.active { color: var(--cyan); text-shadow: 0 0 12px rgba(34,211,238,0.6); }
  .tab-btn svg { width: 28px; height: 28px; }

  .mascot { font-size: 64px; line-height: 1; filter: drop-shadow(0 0 24px rgba(192,132,252,0.7)); }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

  .feedback-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 20px 16px 24px;
    border-top: 2px solid var(--border);
    background: rgba(20,20,40,0.95);
    backdrop-filter: blur(16px);
    color: var(--text);
    transform: translateY(100%);
    transition: transform 0.3s;
    z-index: 50;
  }
  .feedback-bar.show { transform: translateY(0); }
  .feedback-bar.correct { background: linear-gradient(180deg, rgba(34,197,94,0.25), rgba(20,20,40,0.95)); border-top: 2px solid var(--green); box-shadow: 0 -8px 32px rgba(74,222,128,0.3); }
  .feedback-bar.wrong { background: linear-gradient(180deg, rgba(244,63,94,0.25), rgba(20,20,40,0.95)); border-top: 2px solid var(--red); box-shadow: 0 -8px 32px rgba(251,113,133,0.3); }

  .ring-progress { transform: rotate(-90deg); }

  .badge-card {
    background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(232,121,249,0.2));
    border: 2px solid rgba(251,191,36,0.6);
    border-bottom-width: 4px;
    box-shadow: 0 0 24px rgba(251,191,36,0.3);
  }
  .locked-badge { background: rgba(140,140,180,0.08); border: 2px solid rgba(140,140,180,0.2); opacity: 0.55; }

  .reward-card {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 2px solid var(--border);
    border-bottom-width: 4px;
    border-radius: 16px;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .reward-card:hover { transform: translateY(-2px); border-color: var(--border-bright); box-shadow: 0 6px 24px rgba(192,132,252,0.25); }

  /* Inputs */
  input { background: rgba(20,20,40,0.6) !important; color: var(--text) !important; border-color: var(--border) !important; }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--cyan) !important; box-shadow: 0 0 0 3px rgba(34,211,238,0.2); }

  /* Phone frame for desktop preview */
  @media (min-width: 600px) {
    body { display: flex; align-items: center; justify-content: center; padding: 20px; }
    #app {
      max-width: 420px;
      height: 90vh;
      max-height: 880px;
      box-shadow: 0 0 60px rgba(192,132,252,0.4), 0 0 120px rgba(34,211,238,0.2), 0 20px 80px rgba(0,0,0,0.6);
      border-radius: 36px;
      overflow: hidden;
      position: relative;
      border: 2px solid rgba(192,132,252,0.3);
    }
  }
  #app {
    background:
      radial-gradient(ellipse at 30% 0%, rgba(192,132,252,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 100%, rgba(34,211,238,0.15) 0%, transparent 50%),
      linear-gradient(180deg, #0a0a1f 0%, #14142b 100%);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
    z-index: 1;
  }
  .screen { flex: 1; overflow-y: auto; padding-bottom: 80px; }
  .nav-bar {
    background: rgba(10,10,30,0.85);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 4px 4px 8px;
    position: relative;
    z-index: 2;
  }

  /* Glowing accent text */
  .glow-cyan { text-shadow: 0 0 16px rgba(34,211,238,0.7); }
  .glow-magenta { text-shadow: 0 0 16px rgba(232,121,249,0.7); }
  .glow-green { text-shadow: 0 0 16px rgba(74,222,128,0.7); }
</style>
</head>
<body>
<div id="app">
  <div id="screen" class="screen"></div>
  <div id="nav" class="nav-bar"></div>
</div>

function seededRandom(seed) {
  // deterministic so leaderboard is stable per day
  let s = 0;
  for (let i = 0; i < seed.length; i++) s = (s * 31 + seed.charCodeAt(i)) >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return (s & 0xfffffff) / 0xfffffff; };
}

function getLeaderboard(period) {
  // period: 'daily' | 'weekly' | 'alltime'
  const today = new Date().toISOString().slice(0, 10);
  const seed = period === "daily" ? today : period === "weekly" ? today.slice(0,7) : "alltime";
  const rng = seededRandom(seed);
  const players = FAKE_PLAYERS.map(p => ({
    ...p,
    xp: Math.floor(rng() * (period === "alltime" ? 8000 : period === "weekly" ? 1500 : 350))
  }));
  let myXp = state.xp;
  if (period === "daily") myXp = state.todayDate === today ? Math.min(state.xp, state.todayQuestions * 10) : 0;
  if (period === "weekly") myXp = Math.min(state.xp, 1200);
  players.push({ name: state.name || "You", avatar: state.avatar, xp: myXp, isMe: true });
  players.sort((a,b) => b.xp - a.xp);
  return players;
}

// ---------- Daily reset logic ----------
function checkDaily() {
  const today = new Date().toISOString().slice(0, 10);
  if (state.todayDate !== today) {
    state.todayDate = today;
    state.todayQuestions = 0;
  }
  saveState();
}

function updateStreak() {
  const today = new Date().toISOString().slice(0, 10);
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (state.lastPlayedDate === today) return;
  if (state.lastPlayedDate === yesterday) {
    state.streak += 1;
  } else {
    state.streak = 1;
  }
  state.lastPlayedDate = today;
  saveState();
}

// ----- Quiz -----
async function startQuiz(subjectKey, topicKey, difficulty, qCount) {
  // === Swap this with real fetch ===
  const pool = await fetchQuestions(subjectKey, topicKey, difficulty, qCount);
  // shuffle
  const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, qCount);
  quizSession = {
    subjectKey, topicKey, difficulty, qCount,
    questions: shuffled,
    idx: 0, correct: 0,
    selected: null, locked: false,
    answersLog: []
  };
  go("quiz");
}

// Mock fetcher — replace with your backend call.
async function fetchQuestions(subject, topic, difficulty, count) {
  const t = QUESTION_BANK[subject]?.topics[topic];
  if (!t) return [];
  let pool = [...t.questions];
  while (pool.length < count) pool = pool.concat(t.questions);
  return pool;
}

function renderQuiz() {
  if (!quizSession) { go("home"); return; }
  const { questions, idx, qCount, selected, locked } = quizSession;
  const q = questions[idx];
  const pct = (idx / qCount) * 100;
  const letters = ["A","B","C","D"];

  screenEl.innerHTML = `
    <div class="p-4">
      <!-- Top: progress + close -->
      <div class="flex items-center gap-3 pt-2 mb-4">
        <button onclick="confirmQuit()" class="text-2xl text-gray-400 font-black">✕</button>
        <div class="progress-bar flex-1"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="text-sm font-black text-gray-500">${idx + 1}/${qCount}</div>
      </div>

      <div class="slide-up" key="${idx}">
        <div class="text-xs font-black uppercase text-gray-500 mb-1">Question ${idx + 1}</div>
        <h2 class="text-xl font-black leading-snug mb-6">${q.q}</h2>

        <div class="space-y-3">
          ${q.o.map((opt, i) => {
            let cls = "answer-tile";
            if (locked) {
              if (i === q.a) cls += " correct";
              else if (i === selected) cls += " wrong";
              cls += " locked";
            } else if (selected === i) cls += " selected";
            return `<div class="${cls}" ${locked ? '' : `onclick="selectAnswer(${i})"`}>
              <div class="letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>`;
          }).join("")}

    `;
  }
}

window.selectAnswer = function(i) {
  if (!quizSession || quizSession.locked) return;
  quizSession.selected = i;
  renderQuiz();
};

window.checkAnswer = function() {
  if (quizSession.selected === null) return;
  quizSession.locked = true;
  const q = quizSession.questions[quizSession.idx];
  const isCorrect = quizSession.selected === q.a;
  if (isCorrect) quizSession.correct += 1;
  quizSession.answersLog.push({ qIdx: quizSession.idx, picked: quizSession.selected, correct: isCorrect });

  renderQuiz();

  const fb = document.getElementById("feedback");
  fb.className = `feedback-bar show ${isCorrect ? 'correct' : 'wrong'}`;
  document.getElementById("feedback-content").innerHTML = `
    <div class="flex items-center gap-3 mb-3">
      <div class="text-4xl">${isCorrect ? '🎉' : '💔'}</div>
      <div class="flex-1">
        <div class="font-black text-lg" style="color:${isCorrect ? 'var(--green-dark)' : 'var(--red-dark)'}">${isCorrect ? 'Nice!' : 'Not quite.'}</div>
        <div class="text-sm font-bold text-gray-700">${q.exp}</div>
      </div>
    </div>
    <button class="btn-3d ${isCorrect ? 'btn-green' : 'btn-red'} w-full py-4 text-lg" onclick="nextQuestion()">${quizSession.idx + 1 === quizSession.qCount ? 'Finish' : 'Continue'}</button>
  `;
  if (isCorrect) burstConfetti(20);
};

window.nextQuestion = function() {
  if (quizSession.idx + 1 >= quizSession.qCount) {
    finishQuiz();
    return;
  }
  quizSession.idx += 1;
  quizSession.selected = null;
  quizSession.locked = false;
  renderQuiz();
};

window.confirmQuit = function() {
  if (confirm("Quit this quiz? Your progress won't be saved.")) {
    quizSession = null;
    go("home");
  }
};

function finishQuiz() {
  const { correct, qCount, subjectKey, topicKey } = quizSession;
  const xpGained = correct * 10;
  const gemsGained = correct * 2;
  const perfectBonus = correct === qCount ? 20 : 0;
  const totalXp = xpGained + perfectBonus;

  state.xp += totalXp;
  state.gems += gemsGained;
  state.attemptedTotal += qCount;
  state.correctTotal += correct;
  state.todayQuestions += qCount;
  state.history = (state.history || []).concat([{
    date: new Date().toISOString().slice(5,10),
    subject: subjectKey, topic: topicKey,
    correct, total: qCount, xp: totalXp
  }]);
  if (state.history.length > 50) state.history = state.history.slice(-50);

  updateStreak();
  const newBadges = checkBadges();
  state.rank = getRank(state.xp).name;
  saveState();

  quizSession = { ...quizSession, results: { correct, qCount, xpGained: totalXp, gemsGained, perfectBonus, newBadges } };
  go("results");
}

  const board = getLeaderboard(lbPeriod);
  const myIdx = board.findIndex(p => p.isMe);
  screenEl.innerHTML = `
    <div class="p-4 space-y-4">
      <div class="pt-2">
        <div class="text-xs font-bold uppercase text-gray-500">Leaderboard</div>
        <div class="text-2xl font-black">Who's grinding today?</div>
      </div>

      <div class="grid grid-cols-3 bg-white rounded-2xl p-1 border-2 border-gray-200">
        ${["daily","weekly","alltime"].map(p => `
          <button onclick="lbPeriod='${p}'; render()" class="py-2 rounded-xl text-xs font-black uppercase ${lbPeriod === p ? 'bg-blue-500 text-white' : 'text-gray-500'}">${p === 'alltime' ? 'All-time' : p}</button>
        `).join("")}
      </div>

      <!-- Top 3 podium -->
      <div class="flex items-end gap-2 justify-center py-2">
        ${[1,0,2].map(i => {
          if (!board[i]) return '';
          const heights = [100, 80, 60];
          const colors = ['#ffc800', '#c0c0c0', '#cd7f32'];
          const rank = i + 1;
          return `<div class="flex-1 flex flex-col items-center">
            <div class="text-3xl mb-1 ${rank===1?'bounce':''}">${board[i].avatar}</div>
            <div class="text-xs font-black truncate w-full text-center">${board[i].name}${board[i].isMe?' (You)':''}</div>
            <div class="text-xs font-bold text-gray-500">${board[i].xp} XP</div>
            <div class="w-full rounded-t-xl mt-1 flex items-center justify-center font-black text-white" style="height:${heights[rank-1]}px; background:${colors[rank-1]}">${rank}</div>
          </div>`;
        }).join("")}
      </div>

      <!-- Rest -->
      <div class="bg-white rounded-2xl border-2 border-gray-200 overflow-hidden">
        ${board.slice(3).map((p, i) => `
          <div class="flex items-center gap-3 p-3 ${i > 0 ? 'border-t border-gray-100' : ''} ${p.isMe ? 'bg-blue-50' : ''}">
            <div class="w-7 text-center font-black text-gray-400">${i+4}</div>
            <div class="text-2xl">${p.avatar}</div>
            <div class="flex-1 font-black ${p.isMe ? 'text-blue-700' : ''}">${p.name}${p.isMe?' (You)':''}</div>
            <div class="text-sm font-black text-gray-600">${p.xp} XP</div>
          </div>`).join("")}
      </div>

      <div class="text-center text-xs font-bold text-gray-400">You're #${myIdx + 1} ${lbPeriod === 'daily' ? 'today' : lbPeriod === 'weekly' ? 'this week' : 'overall'}</div>
    </div>`;
}

// ----- Shop -----
function renderShop() {
  screenEl.innerHTML = `
    <div class="p-4 space-y-4">
      <div class="pt-2 flex items-center justify-between">
        <div>
          <div class="text-xs font-bold uppercase text-gray-500">Rewards Shop</div>
          <div class="text-2xl font-black">Spend your gems 💎</div>
        </div>
        <div class="bg-purple-100 px-3 py-2 rounded-xl font-black text-purple-700">💎 ${state.gems}</div>
      </div>

      <div class="bg-blue-50 rounded-2xl p-3 text-sm font-bold text-blue-700 border-2 border-blue-200">
        💡 Earn 2 💎 per correct answer. Real rewards ship to your school once a month.
      </div>

      <div class="grid grid-cols-2 gap-3">
        ${REWARDS.map(r => {
          const owned = state.ownedRewards.includes(r.id);
          const affordable = state.gems >= r.cost;
          return `
            <div class="reward-card p-3 text-center">
              <div class="text-4xl mb-2">${r.emoji}</div>
              <div class="font-black text-sm leading-tight">${r.name}</div>
              <div class="text-[10px] font-bold text-gray-500 my-1 leading-tight">${r.desc}</div>
              <button onclick="redeem('${r.id}')" class="btn-3d ${owned ? 'btn-white' : affordable ? 'btn-purple' : 'btn-disabled'} w-full py-2 text-xs mt-2" ${owned || !affordable ? 'disabled' : ''}>
                ${owned ? 'Owned ✓' : `💎 ${r.cost}`}
              </button>
            </div>`;
        }).join("")}
      </div>
    </div>`;
}
window.redeem = function(id) {
  const r = REWARDS.find(x => x.id === id);
  if (!r || state.ownedRewards.includes(id) || state.gems < r.cost) return;
  if (!confirm(`Spend ${r.cost} 💎 on ${r.name}?`)) return;
  state.gems -= r.cost;
  state.ownedRewards.push(id);
  if (r.type === "avatar") state.avatar = r.value;
  saveState();
  alert(`🎉 Redeemed! ${r.type === "avatar" ? "Avatar equipped." : "We'll mail it to your school next dispatch."}`);
  render();
};

// ----- Profile -----
function renderProfile() {
  const rank = getRank(state.xp);
  const nextRank = getNextRank(state.xp);
  const acc = state.attemptedTotal === 0 ? 0 : Math.round((state.correctTotal / state.attemptedTotal) * 100);
  const lvl = levelFromXp(state.xp);

  screenEl.innerHTML = `
    <div class="p-4 space-y-4">
      <div class="pt-4 flex flex-col items-center text-center">
        <div class="text-7xl mb-2">${state.avatar}</div>
        <div class="text-2xl font-black">${state.name}</div>
        <div class="flex items-center gap-2 font-black mt-1" style="color:${rank.color}">${rank.emoji} ${rank.name} · Lvl ${lvl}</div>
        ${nextRank ? `<div class="text-xs font-bold text-gray-500 mt-1">${nextRank.min - state.xp} XP to ${nextRank.name}</div>` : ''}
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div class="bg-white rounded-2xl p-3 text-center border-2 border-gray-200" style="border-bottom-width:4px;">
          <div class="text-xs font-black uppercase text-gray-500">XP</div>
          <div class="text-xl font-black">${state.xp}</div>
        </div>
        <div class="bg-white rounded-2xl p-3 text-center border-2 border-gray-200" style="border-bottom-width:4px;">
          <div class="text-xs font-black uppercase text-gray-500">Accuracy</div>
          <div class="text-xl font-black">${acc}%</div>
        </div>
        <div class="bg-white rounded-2xl p-3 text-center border-2 border-gray-200" style="border-bottom-width:4px;">
          <div class="text-xs font-black uppercase text-gray-500">Streak</div>
          <div class="text-xl font-black">🔥 ${state.streak}</div>
        </div>
      </div>

      <div>
        <div class="text-sm font-black uppercase text-gray-500 mb-2 px-1">Badges</div>
        <div class="grid grid-cols-4 gap-2">
          ${BADGES.map(b => {
            const earned = state.badges.includes(b.id);
            return `<div class="${earned ? 'badge-card' : 'locked-badge'} p-3 rounded-2xl text-center" style="border-radius:16px;">
              <div class="text-3xl ${earned ? '' : 'grayscale opacity-50'}">${earned ? b.emoji : '🔒'}</div>
              <div class="text-[10px] font-black uppercase mt-1 leading-tight">${b.name}</div>
            </div>`;
          }).join("")}
        </div>
      </div>

      <div>
        <div class="text-sm font-black uppercase text-gray-500 mb-2 px-1">Daily Goal</div>
        <div class="bg-white rounded-2xl p-4 border-2 border-gray-200" style="border-bottom-width:4px;">
          <div class="flex items-center gap-2">
            ${[3,5,10,15].map(n => `
              <button onclick="setGoal(${n})" class="flex-1 py-2 rounded-xl font-black border-2 ${state.dailyGoal === n ? 'border-blue-400 bg-blue-50 text-blue-700' : 'border-gray-200 bg-white'}">${n}</button>
            `).join("")}
          </div>
        </div>
      </div>

      <div class="space-y-2">
        <button onclick="resetProgress()" class="btn-3d btn-white w-full py-3 text-sm">Reset Progress</button>
        <div class="text-center text-xs font-bold text-gray-400">QuizQuest · CuriousLab Prototype</div>
      </div>
    </div>`;
}
window.setGoal = function(n) { state.dailyGoal = n; saveState(); render(); };
window.resetProgress = function() {
  if (!confirm("Wipe ALL progress? This can't be undone.")) return;
  localStorage.removeItem("quizquest_state");
  state = { ...DEFAULT_STATE };
  go("home");
};

// ----- Confetti -----
function burstConfetti(n) {
  const colors = ["#58cc02","#1cb0f6","#ffc800","#ff4b4b","#ce82ff","#ff86c8"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animation = `fall ${1.5 + Math.random() * 1.5}s linear forwards`;
    c.style.animationDelay = Math.random() * 0.3 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

// ---------- Boot ----------
render();
</script>
</body>
</html>
